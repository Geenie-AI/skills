
name: Geenie AI Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: NVIDIA SkillSpector
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # 3. Install NVIDIA SkillSpector
      - name: Install SkillSpector
        run: |
          uv tool install \
            git+https://github.com/NVIDIA/skillspector.git

      # 4. Locate skills
      - name: Locate AI skills
        run: |
          echo "Searching for SKILL.md files..."
          find . \
            -name SKILL.md \
            -not -path './.git/*' \
            -print

      # 5. Security scan
      - name: Run AI security scan
        run: |
          set -euo pipefail

          skillspector scan . \
            --recursive \
            --no-llm \
            --format json \
            --output skillspector-report.json \
            --fail-on-findings \
            --fail-on-incomplete \
            --min-coverage 100

      # 6. Upload security report
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geenie-ai-security-report
          path: skillspector-report.json
          if-no-files-found: warn
          retention-days: 90
