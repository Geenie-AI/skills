name: release

# Tag vX.Y.Z (or vX.Y.Z-rc.N) on main to publish the repository:
#   1. static validation of every skill, catalogue in sync
#   2. the marketplace manifest's version must equal the tag
#   3. every skill's release scenario on Claude Code (blocking; authenticates
#      with the job's GitHub OIDC token, see .github/actions/anthropic-oidc)
#   4. one zip per skill and a GitHub release with the matching CHANGELOG
#      section as its body; pre-release when the version has '-'

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve version from the tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Tag must be on main
        run: |
          git fetch origin main --depth=200
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag commit is not on main"; exit 1; }

      - name: Static validation and catalogue check
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          python3 scripts/validate.py
          python3 scripts/skillrepo.py sync --check

      - name: Marketplace version equals the tag
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          v = os.environ["VERSION"]
          found = json.load(open(".claude-plugin/marketplace.json")).get("version")
          if found != v:
              print(f"version mismatch: tag is {v}, marketplace.json says {found}; set it, run scripts/skillrepo.py sync, and re-tag")
              sys.exit(1)
          print(f"marketplace agrees on {v}")
          PY

      - name: Changelog section exists
        run: |
          python3 scripts/changelog-section.py "${{ steps.ver.outputs.version }}" > release-notes.md
          cat release-notes.md

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Authenticate to the Claude API (OIDC)
        uses: ./.github/actions/anthropic-oidc
        with:
          federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID || 'fdrl_01PrmDFQLci9MR5jJ4LBYErq' }}
          organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID || '76d14e63-d21e-4395-93a9-3e5acb6de83b' }}
          service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID || 'svac_01JWKCu1ZZ4kPtxMDVwjEBNP' }}
          workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID || 'wrkspc_01SpcAkLhYsuwRVbt3ymRuTy' }}

      - name: Release scenarios on Claude Code (blocking)
        run: |
          status=0
          for skill in $(python3 scripts/skillrepo.py list); do
            scenario="$(python3 scripts/skillrepo.py config "$skill" eval.release_scenario)"
            if [ -z "$scenario" ]; then
              echo "::warning::$skill has no eval.release_scenario in tests/$skill/config.yaml; skipped"
              continue
            fi
            scripts/run-scenario.sh --skill "$skill" --host claude --scenario "$scenario" \
              --out "eval-out/$skill/$scenario-claude" || status=1
          done
          exit $status

      - name: Package every skill
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          for skill in $(python3 scripts/skillrepo.py list); do
            (cd skills && zip -r "../dist/$skill-$VERSION.zip" "$skill" -x "$skill/README.md" -x '*.DS_Store' -x '*/__pycache__/*')
          done
          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=""
          [ "${{ steps.ver.outputs.prerelease }}" = "true" ] && ARGS="--prerelease"
          gh release create "${{ steps.ver.outputs.tag }}" dist/*.zip \
            --title "Geenie-AI skills ${{ steps.ver.outputs.tag }}" \
            --notes-file release-notes.md $ARGS

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-eval
          path: eval-out/
          if-no-files-found: ignore
